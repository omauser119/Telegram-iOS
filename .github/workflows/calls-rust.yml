name: Build unsigned Telegram for iPhone
on:
  workflow_dispatch:
  push:
    branches: [calls-rust]
permissions:
  contents: read
jobs:
  iphoneos:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Use HTTPS for upstream submodules
        run: |
          git config --global url.https://github.com/.insteadOf git@github.com:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          targets: wasm32-wasip1,aarch64-apple-ios
      - name: Select the pinned Xcode when present
        run: |
          xcode_version="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          task_xcode="/Applications/Xcode_${xcode_version}.app/Contents/Developer"
          if [[ -d "$task_xcode" ]]; then
            echo "DEVELOPER_DIR=$task_xcode" >> "$GITHUB_ENV"
          fi
          xcodebuild -version
      - name: Build pinned Rust media engine for iOS
        run: |
          test -x "$(brew --prefix llvm)/bin/clang" || brew install llvm
          engine="$RUNNER_TEMP/tgcalls-rs"
          git init --quiet "$engine"
          git -C "$engine" fetch --no-tags --depth 1 https://github.com/omauser119/tgcalls-rs.git "$(cat build-system/tgcalls-rust-revision)"
          git -C "$engine" checkout --detach FETCH_HEAD
          bash build-system/prepare-tgcalls-rust.sh "$engine"
      - name: Enable unsigned device packaging
        run: |
          rules=build-system/bazel-rules/rules_apple
          patch="$GITHUB_WORKSPACE/build-system/bazel-rules/patches/unsigned-ios-device.patch"
          git -C "$rules" apply --check "$patch"
          git -C "$rules" apply "$patch"
      - name: Build unsigned iOS arm64 app
        run: |
          python3 -u build-system/Make/Make.py --overrideXcodeVersion \
            --bazelUserRoot="$RUNNER_TEMP/bazel" build \
            --configurationPath=build-system/appstore-configuration.json \
            --unsignedDevice --enableCallsRust \
            --configuration=debug_arm64 --buildNumber="$GITHUB_RUN_NUMBER"
      - name: Verify device Mach-O and archive unsigned IPA
        run: |
          bash build-system/package-unsigned-ios.sh bazel-bin/Telegram/Telegram.ipa "$RUNNER_TEMP/Telegram-iOS-arm64-unsigned.ipa"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Telegram-iOS-arm64-unsigned
          path: ${{ runner.temp }}/Telegram-iOS-arm64-unsigned.ipa*
          if-no-files-found: error
